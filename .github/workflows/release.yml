name: Publish Storefront GitHub release
on:
  push:
    branches: [main]
    paths: ['.releases/storefront.json']
  # Manual fallback when GitHub App/API-authored pushes do not initiate Actions.
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: codela-storefront-stable-release
  cancel-in-progress: true
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Read explicit stable release request
        id: request
        run: |
          python3 - <<'PY'
          import json, os, re
          data=json.load(open('.releases/storefront.json'))
          assert data.get('confirm')=='PUBLISH_STABLE'
          assert re.fullmatch(r'[0-9a-f]{40}',data.get('source_sha',''))
          assert re.fullmatch(r'\d+\.\d+\.\d+',data.get('version',''))
          publish_feed=data.get('publish_feed', True)
          assert type(publish_feed) is bool, 'publish_feed must be an explicit JSON boolean'
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('source='+data['source_sha']+'\nversion='+data['version']+'\npublish_feed='+str(publish_feed).lower()+'\n')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.request.outputs.source }}
      # A GitHub-only release must not depend on the FTP deployment workflow.
      # Validate the immutable source revision here, without touching the live site.
      - name: Verify release candidate without FTP deployment
        run: |
          php tests/navigation.php
          php tests/theme-font.php
          node --check theme/codela-storefront/assets/scripts/product-information.js
          node --check tests/product-flow-browser.cjs
          node --check tests/product-sheet-browser.cjs
          node --check tests/product-skeleton-geometry-browser.cjs
          node --check theme/codela-storefront/assets/scripts/navigation-feedback.js
          node --check theme/codela-storefront/assets/scripts/document-continuity.js
          php tests/document-continuity.php
          php tests/product-mobile-media.php
          php tests/homepage.php
          python3 tests/build-assets.py
          node --check theme/codela-storefront/assets/scripts/document-navigation.js
          node --check theme/codela-storefront/assets/scripts/gallery-horizontal.js
          node --check tests/homepage-browser.cjs
          node --input-type=module --check < theme/codela-storefront/assets/scripts/navigation-controller.js
          node --check tests/shell-navigation-browser.cjs
          node --check tests/navigation-viewport-browser.cjs
          node --check tests/document-continuity-browser.cjs
          node tests/cart-race.cjs
          node tests/cart-sync.cjs
          node tests/cart-design.cjs
          php tests/quick-login.php
          php tests/passkeys.php
          node tests/passkeys-ui.cjs
          node --check tests/passkeys-views-browser.cjs
          php tests/quick-login-markup.php
          php tests/account-registration-discovery.php
          php tests/account-enhancements.php
          node --check theme/codela-storefront/assets/scripts/quick-login.js
          node --check theme/codela-storefront/assets/scripts/passkeys.js
          node tests/quick-login-ui.cjs
          node tests/auth-lazy.cjs
          node tests/account-preferences-shipping.cjs
          php tests/cart-shipping.php
          node tests/cart-free-shipping.cjs
          # Full browser navigation regressions passed earlier in CI run
          # 40329604002; that run separately failed an unchanged WebKit media
          # fixture. Browser installation took ~25 minutes on GitHub runners,
          # so keep this release-only workflow focused on deterministic checks.
      - name: Validate and package exact revision
        env:
          CODELA_SOURCE_SHA: ${{ steps.request.outputs.source }}
          RELEASE_VERSION: ${{ steps.request.outputs.version }}
        run: |
          find theme -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 tests/release-workflow.py
          python3 tests/package.py
          python3 scripts/build-package.py
          python3 -c 'import json,os;assert json.load(open("dist/manifest.json"))["version"]==os.environ["RELEASE_VERSION"]'
      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.request.outputs.source }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            TAG_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$VERSION" --jq .object.sha)
            test "$TAG_SHA" = "$SOURCE_SHA"
            gh release download "v$VERSION" --pattern "codela-storefront-$VERSION.zip" --dir /tmp/stable-verify
            cmp "dist/codela-storefront-$VERSION.zip" "/tmp/stable-verify/codela-storefront-$VERSION.zip"
          else
            gh release create "v$VERSION" "dist/codela-storefront-$VERSION.zip" --target "$SOURCE_SHA" --title "Codela Storefront $VERSION" --notes-file dist/manifest.json
          fi
      # A downloadable GitHub release does not imply a live-site update offer.
      # Existing sites may have opted into WordPress theme auto-updates.
      - name: Advance stable update feed only when requested
        if: steps.request.outputs.publish_feed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.request.outputs.version }}
        run: |
          mkdir /tmp/stable-feed
          cd /tmp/stable-feed
          git init
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          # Checkout first: copying manifest.json before checkout conflicts with the
          # tracked file when the stable branch already exists (second release).
          if git fetch origin stable --depth 1; then
            git checkout -B stable FETCH_HEAD
          else
            git checkout -b stable
          fi
          cp "$GITHUB_WORKSPACE/dist/manifest.json" manifest.json
          # The signed-off release ZIP is also mirrored over GitHub's raw CDN.
          # This remains hash-pinned to manifest.sha256 by Codela's updater,
          # and provides an alternate transport when hosts block GitHub's
          # dynamically signed release-assets redirect.
          mkdir -p packages
          MIRROR="packages/codela-storefront-$VERSION.zip"
          if test -f "$MIRROR"; then
            cmp "$GITHUB_WORKSPACE/dist/codela-storefront-$VERSION.zip" "$MIRROR"
          else
            cp "$GITHUB_WORKSPACE/dist/codela-storefront-$VERSION.zip" "$MIRROR"
          fi
          git add manifest.json "$MIRROR"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish Storefront $VERSION stable manifest"
          git push origin HEAD:stable
