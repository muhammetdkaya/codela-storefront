name: Verify live Codela Agency including real Project Start
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agency-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-pages:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Verify four real service pages and native Studio/Bento homepage
        run: |
          python3 - <<'PY'
          import re, time, uuid
          from html import unescape
          from urllib.parse import urljoin, urlparse, parse_qs
          from urllib.request import Request, urlopen
          BASE='https://codela.dev'
          def get(path):
              q='&' if '?' in path else '?'
              req=Request(BASE+path+q+'agency_verify='+uuid.uuid4().hex,
                  headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'CodelaAgencyDeployCheck/2.0'})
              with urlopen(req,timeout=25) as r:
                  assert r.status==200, 'HTTP failure '+path
                  return r.read().decode('utf-8',errors='replace')
          style=get('/wp-content/themes/codela-storefront/style.css')
          ver=re.search(r'(?m)^Version:\s*(\S+)',style)
          assert ver and ver.group(1)=='0.1.360', 'Unexpected live theme version'
          expected=[
              ('Web Tasarım','mona-bento-web.jpg'),
              ('E-Ticaret','mona-bento-web.jpg'),
              ('Özel Yazılım','mona-studio-hero.jpg'),
              ('Optimizasyon / Destek','mona-studio-hero.jpg'),
          ]
          for attempt in range(3):
              home=get('/')
              assert 'sf-agency-widget--studio' in home and 'sf-agency-widget--bento' in home, 'Studio/Bento homepage missing'
              hrefs=re.findall(r'<a\b[^>]*class="cdl-bento__card[^"]*"[^>]*href="([^"]+)"',home,re.S)
              if len(hrefs)!=4:
                  print('Expected 4 Bento links, got',len(hrefs),flush=True)
                  if attempt<2: time.sleep(5);continue
                  raise AssertionError('Bento links missing')
              seen=set();failures=[]
              for (name,image),raw_href in zip(expected,hrefs):
                  url=urljoin(BASE,unescape(raw_href))
                  parsed=urlparse(url)
                  if parsed.netloc!=urlparse(BASE).netloc or parsed.path in seen:
                      failures.append('Unsafe or duplicate detail URL for '+name);continue
                  seen.add(parsed.path)
                  try:
                      html=get(parsed.path)
                  except Exception as err:
                      failures.append(name+': '+type(err).__name__);continue
                  h1=re.search(r'<h1\b[^>]*id="codela-detail-[^"]+"[^>]*>(.*?)</h1>',html,re.S)
                  heading=' '.join(unescape(re.sub(r'<[^>]+>','',h1.group(1))).split()) if h1 else ''
                  scope=re.search(r'class="cdl-service-detail__scope"[^>]*>.*?<ul\b[^>]*>(.*?)</ul>',html,re.S)
                  count=len(re.findall(r'<li\b',scope.group(1))) if scope else 0
                  checks=['sf-agency-widget--detail','cdl-service-detail__cta',image,'hizmetler=']
                  missing=[s for s in checks if s not in html]
                  if heading!=name or count!=4 or missing:
                      failures.append(f'{name}: heading={heading!r}, scope={count}, missing={missing}')
                  else:
                      print('OK',name,parsed.path,'4 scope tags / correct image / real CTA',flush=True)
              if not failures:
                  print('Studio 0.1.360, Bento and all 4 WordPress service details are live.',flush=True)
                  break
              print('Check attempt',attempt+1,'; '.join(failures),flush=True)
              if attempt<2: time.sleep(5)
              else: raise AssertionError('Live service details failed validation')
          contact=get('/iletisim/')
          required=['sf-agency-widget--contact-bento','cdl-contact__card--primary',
                    'cdl-contact__card--small','cdl-contact__card--strip',
                    'cdl-contact__form','admin-post.php','agency_contact_nonce',
                    'agency_webpage','agency_consent','data-agency-contact-services']
          missing=[m for m in required if m not in contact]
          assert not missing, 'Contact Bento and secured form missing: '+repr(missing)
          assert '<h1' in contact and 'Birlikte başlayalım.' in contact, 'Approved contact header missing'
          print('OK /iletisim/: 1+2+1 Bento, secure native WP form, consent and nonce',flush=True)
          # Ownership-aware links come from the rendered Contact Bento, never
          # an assumed '/proje-baslat/' slug that may belong to someone else.
          primary=re.search(
              r'<a\b[^>]*class="cdl-contact__card cdl-contact__card--primary"[^>]*href="([^"]+)"',
              contact,re.S)
          assert primary, 'Contact CTA missing'
          project_url=urljoin(BASE,unescape(primary.group(1)))
          project_path=urlparse(project_url).path
          assert urlparse(project_url).netloc==urlparse(BASE).netloc and project_path not in ('/','/iletisim/'), 'Project CTA still points to fallback'
          print('Contact primary link:',project_path,flush=True)
          # A new page can be installed only after plugin 1.2.24 has reached FTP.
          for i in range(5):
              project=get(project_path)
              if 'sf-agency-widget--project' in project:
                  break
              if i==4: raise AssertionError('Project Start WordPress page not installed')
              time.sleep(8)
          expected_controls=[
             'sf-agency-widget--project','data-project-step="1"',
             'data-project-step="2"','data-project-next','data-project-back',
             'agency_project_nonce','agency_project_webpage',
             'agency_project_consent','codela_sf_agency_project',
             'agency_project_name','agency_project_contact',
             'agency_project_note','admin-post.php'
          ]
          missing=[x for x in expected_controls if x not in project]
          assert not missing, 'Project form missing secured native controls: '+repr(missing)
          counts={'agency_project_service':4,'agency_project_time':3,'agency_project_scale':3}
          for field,n in counts.items():
              actual=len(re.findall(r'name="'+field+r'"',project))
              assert actual==n, f'Project Start {field}: {actual}, expected {n}'
          assert 'Neye odaklanıyoruz?' in project, 'Project stage 1 headline missing'
          # Merely adding a query parameter cannot fake a successful submission.
          spoofed=get(project_path+'?codela_status=sent')
          assert 'cdl-project__success' not in spoofed and 'data-project-form' in spoofed, 'Project success can be spoofed without receipt'
          for (name,_),raw_href in zip(expected,hrefs):
              detail=get(urlparse(urljoin(BASE,unescape(raw_href))).path)
              button=re.search(r'<a\b[^>]*class="cdl-service-detail__cta"[^>]*href="([^"]+)"',detail,re.S)
              assert button, 'Missing Project Start CTA: '+name
              target=urlparse(urljoin(BASE,unescape(button.group(1))))
              selected=parse_qs(target.query).get('hizmetler',[''])[0]
              assert target.path==project_path and selected==name, 'Detail links to wrong project / service: '+name
          print('OK Project Start: 2 steps, 4/3/3 options, nonce/consent/honeypot, verified links from all four services, and no spoofed success',flush=True)
          PY
