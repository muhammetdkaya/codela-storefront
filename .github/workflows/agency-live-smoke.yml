name: Verify Codela agency homepage on public site
on:
  push:
    branches: [main]
    paths: ['.github/workflows/agency-live-smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-homepage:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Verify deployed theme version and newly rendered agency content
        run: |
          python3 - <<'PY'
          import re, time, urllib.request, uuid
          base='https://codela.dev'
          def get(path):
              url=base+path+('?' if '?' not in path else '&')+'agency_verify='+uuid.uuid4().hex
              req=urllib.request.Request(url,headers={'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'CodelaAgencyDeployCheck/1.0'})
              with urllib.request.urlopen(req,timeout=25) as r:
                  print('HTTP',r.status,'path',path,'cache',r.headers.get('x-cache'),r.headers.get('cf-cache-status'),flush=True)
                  return r.read().decode('utf-8',errors='replace')
          style=get('/wp-content/themes/codela-storefront/style.css')
          ver=re.search(r'(?m)^Version: (\S+)',style)
          print('Installed version:',ver.group(1) if ver else 'NOT FOUND',flush=True)
          assert ver and ver.group(1)=='0.1.316','FTP theme version did not update'
          for attempt in range(3):
              home=get('/')
              markers={t:t in home for t in ['sf-agency-swap-stage','sf-agency-service-track','sf-agency-hero-variant-switch',"İyi fikirler."]}
              print('Homepage markers',markers,'length',len(home),flush=True)
              if all(markers[k] for k in list(markers)[:3]): break
              time.sleep(5)
          else:
              raise AssertionError('Theme deployed but agency homepage still serves old template or cached content')
          print('Published agency homepage verified successfully')
          PY
