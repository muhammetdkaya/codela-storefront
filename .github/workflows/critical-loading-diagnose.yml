name: Storefront critical loading comparison
on:
  pull_request:
    paths: ['tools/critical-loading-diagnose.cjs', '.github/workflows/critical-loading-diagnose.yml']
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/critical-loading-diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: critical-loading-comparison
          path: qa/performance/critical-loading.json
          retention-days: 14
