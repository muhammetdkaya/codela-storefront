name: Product purchase flow (no deployment)
on:
  pull_request:
    paths:
      # Purchase flow is independent of Agency and theme release metadata.
      # Keep shared product/button/overlay changes in scope.
      - 'theme/codela-storefront/woocommerce/single-product/**'
      - 'theme/codela-storefront/inc/product.php'
      - 'theme/codela-storefront/inc/product-mobile-media.php'
      - 'theme/codela-storefront/inc/render.php'
      - 'theme/codela-storefront/functions.php'
      - 'theme/codela-storefront/assets/scripts/product*.js'
      - 'theme/codela-storefront/assets/scripts/gallery*.js'
      - 'theme/codela-storefront/assets/scripts/cart-controller.js'
      - 'theme/codela-storefront/assets/scripts/overlay-controller.js'
      - 'theme/codela-storefront/assets/scripts/dock-controller.js'
      - 'theme/codela-storefront/assets/scripts/commerce-links.js'
      - 'theme/codela-storefront/assets/styles/product.css'
      - 'theme/codela-storefront/assets/styles/gallery.css'
      - 'theme/codela-storefront/assets/styles/components.css'
      - 'theme/codela-storefront/assets/styles/overlay.css'
      - 'theme/codela-storefront/assets/styles/navigation.css'
      - 'tests/product*.cjs'
      - 'tests/product*.php'
      - 'tests/gallery*.cjs'
      - 'tests/product-flow-browser.cjs'
      - '.github/workflows/product-flow.yml'
permissions:
  contents: read
jobs:
  product-flow:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium webkit
      - name: Native adapters and shared cart contracts
        run: |
          php tests/product-cart-result.php
          php tests/product-composition.php
          php tests/render-product-sheet.php >/dev/null
          php tests/render-product-information.php >/dev/null
          node tests/cart-race.cjs
          node tests/cart-sync.cjs
          python3 tests/build-assets.py
          # Existing mobile sheet geometry must remain unchanged after the new close/end behavior.
          node tests/product-sheet-handoff-browser.cjs
          node tests/product-sheet-browser.cjs
          node tests/gallery-defer-browser.cjs
          node tests/product-flow-browser.cjs
          TEST_WEBKIT=1 node tests/product-flow-browser.cjs
