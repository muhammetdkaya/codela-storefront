name: Storefront live performance audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/performance-audit.cjs', '.github/workflows/performance-audit.yml']
permissions:
  contents: read
jobs:
  measure:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/performance-audit.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-live-performance
          path: qa/performance/
          retention-days: 30
