name: Account skeleton and icon back regression
on:
  push:
    branches: [fix/catalog-product-return-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Source and package checks
        run: |
          php -l theme/codela-storefront/inc/render.php
          php tests/navigation.php
          php tests/catalog.php
          php tests/document-continuity.php
          node tests/ui-kit.cjs
          node --check theme/codela-storefront/assets/scripts/navigation-feedback.js
          python3 tests/package.py
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Confirm 0.1.188 fails the reported no-referrer return
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin 4a1e9b38d774735a72aa5433b59a912d3aa516b2 --depth=1
          git show 4a1e9b38d774735a72aa5433b59a912d3aa516b2:theme/codela-storefront/assets/scripts/document-continuity.js > /tmp/storefront-188-continuity.js
          if CONTEXT_SCRIPT=/tmp/storefront-188-continuity.js node tests/catalog-context-return-browser.cjs > /tmp/before.log 2>&1; then
            cat /tmp/before.log
            echo '::error::Old code unexpectedly passed the home return test'
            exit 1
          fi
          cat /tmp/before.log
          grep -q 'home to product must return home' /tmp/before.log
      - name: Responsive skeleton and context regression
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/catalog-context-return-browser.cjs
          node tests/header-routing-browser.cjs
          node tests/desktop-product-skeleton-browser.cjs
          node tests/account-skeleton-browser.cjs
          node tests/context-header-browser.cjs
          node tests/product-skeleton-geometry-browser.cjs
          node tests/navigation-feedback-bottom-browser.cjs
      - name: Native cross-document continuity (Chromium API)
        if: matrix.browser == 'chromium'
        run: node tests/document-continuity-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-skeleton-${{ matrix.browser }}
          path: qa/
