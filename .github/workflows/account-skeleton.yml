name: Account skeleton and icon back regression
on:
  push:
    branches: [fix/catalog-heading-product-cart-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Source and package checks
        run: |
          php -l theme/codela-storefront/inc/render.php
          php tests/navigation.php
          php tests/catalog.php
          php tests/document-continuity.php
          node tests/ui-kit.cjs
          node --check theme/codela-storefront/assets/scripts/navigation-feedback.js
          python3 tests/package.py
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Confirm the previous CSS and header fail the new checks
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin 7abfadd64ece836629351729b13e2b128b037f33 --depth=1
          git show 7abfadd64ece836629351729b13e2b128b037f33:theme/codela-storefront/assets/scripts/navigation-feedback.js > /tmp/previous-feedback.js
          git show 7abfadd64ece836629351729b13e2b128b037f33:theme/codela-storefront/assets/styles/catalog.css > /tmp/previous-catalog.css
          if HEADER_TEST_SCOPE=cart HEADER_FEEDBACK_SCRIPT=/tmp/previous-feedback.js node tests/catalog-header-skeleton-browser.cjs > /tmp/before-cart.log 2>&1; then cat /tmp/before-cart.log; exit 1; fi
          cat /tmp/before-cart.log
          grep -q 'cart header .* should match actual product' /tmp/before-cart.log
          if HEADER_TEST_SCOPE=heading HEADER_CATALOG_CSS=/tmp/previous-catalog.css node tests/catalog-header-skeleton-browser.cjs > /tmp/before-heading.log 2>&1; then cat /tmp/before-heading.log; exit 1; fi
          cat /tmp/before-heading.log
          grep -q 'duplicate archive title visually hidden' /tmp/before-heading.log
      - name: Responsive skeleton and context regression
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/catalog-header-skeleton-browser.cjs
          node tests/context-header-browser.cjs
          node tests/catalog-context-return-browser.cjs
          node tests/product-skeleton-geometry-browser.cjs
          node tests/navigation-feedback-bottom-browser.cjs
      - name: Catalog filters remain functional
        if: matrix.browser == 'chromium'
        run: node tests/catalog-filters-browser.cjs
      - name: Native cross-document continuity (Chromium API)
        if: matrix.browser == 'chromium'
        run: node tests/document-continuity-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-skeleton-${{ matrix.browser }}
          path: qa/
