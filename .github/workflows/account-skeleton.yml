name: Product navigation visibility regression
on:
  push:
    branches: [fix/product-no-dock-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Source and package checks
        run: |
          php -l theme/codela-storefront/inc/render.php
          php tests/navigation.php
          node --check theme/codela-storefront/assets/scripts/product-information.js
          node tests/dock-gesture.cjs
          node tests/ui-kit.cjs
          python3 tests/package.py
      - name: Install browser
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Product states and destination regression
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/product-no-dock-browser.cjs
          node tests/navigation-feedback-bottom-browser.cjs
          node tests/catalog-header-skeleton-browser.cjs
          node tests/product-skeleton-geometry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-no-dock-${{ matrix.browser }}
          path: qa/
          if-no-files-found: ignore
