name: Showcase background regression (no deployment)
on:
  push:
    branches: [fix/showcase-background-cover-20261028]
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  pull_request:
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-viewport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and package without publication
        run: |
          find theme -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php tests/homepage.php
          php tests/front-page-source.php
          php tests/sections-preview.php
          node --check theme/codela-storefront/assets/scripts/gallery-horizontal.js
          node --check tests/showcase-viewport-browser.cjs
          node tests/showcase-caption.cjs
          python3 tests/package.py
      - name: Install one browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if [ '${{ matrix.browser }}' = chromium ] && command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Fetch the public AZ banner for labeled fixture previews
        run: |
          curl --fail --location --retry 1 --max-time 30 'https://azseramik.com/wp-content/uploads/2026/10/AZ-Seramik-Kadin-Girisimci-Slider-v4-1024x466.webp' -o /tmp/showcase-az.webp
          echo 'SHOWCASE_REAL_IMAGE=/tmp/showcase-az.webp' >> "$GITHUB_ENV"
      - name: Background coverage, preserved frame, native header/dock and fallback acceptance
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/showcase-viewport-browser.cjs
          node tests/homepage-browser.cjs
      - name: Prove the previous separate-band CSS fails the background contract
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin c4d6d387abad1f847b82f2d742dcc27ac9e4b761 --depth=1
          git show c4d6d387abad1f847b82f2d742dcc27ac9e4b761:theme/codela-storefront/assets/styles/sections.css > /tmp/showcase-before.css
          SHOWCASE_CSS=/tmp/showcase-before.css SHOWCASE_PHASE=before-182 SHOWCASE_SCREENSHOTS_ONLY=1 node tests/showcase-viewport-browser.cjs
          if SHOWCASE_CSS=/tmp/showcase-before.css node tests/showcase-viewport-browser.cjs > /tmp/showcase-before.log 2>&1; then
            cat /tmp/showcase-before.log
            echo '::error::Previous separate-band CSS unexpectedly passed'
            exit 1
          fi
          cat /tmp/showcase-before.log
          grep -q 'photo covers entire slide including caption' /tmp/showcase-before.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-viewport-${{ matrix.browser }}
          path: |
            qa/storefront-ui-kit-showcase-*.png
            qa/showcase-viewport-*.json
          if-no-files-found: warn
          retention-days: 14
