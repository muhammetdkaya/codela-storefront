name: Showcase viewport regression (no deployment)
on:
  push:
    branches: [fix/showcase-viewport-sizing-20261028]
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  pull_request:
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-viewport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and package without publication
        run: |
          find theme -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php tests/homepage.php
          php tests/front-page-source.php
          php tests/sections-preview.php
          node --check theme/codela-storefront/assets/scripts/gallery-horizontal.js
          node --check tests/showcase-viewport-browser.cjs
          node tests/showcase-caption.cjs
          python3 tests/package.py
      - name: Install one browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if [ '${{ matrix.browser }}' = chromium ] && command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Viewport, native header/dock, responsive-source and fallback acceptance
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/showcase-viewport-browser.cjs
          node tests/homepage-browser.cjs
      - name: Prove the previous viewport CSS fails the new regression
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin cd2b5bebae97693b5f8137d6e917e06cfd6b6868 --depth=1
          git show cd2b5bebae97693b5f8137d6e917e06cfd6b6868:theme/codela-storefront/assets/styles/sections.css > /tmp/showcase-before.css
          if SHOWCASE_CSS=/tmp/showcase-before.css node tests/showcase-viewport-browser.cjs > /tmp/showcase-before.log 2>&1; then
            cat /tmp/showcase-before.log
            echo '::error::Previous viewport CSS unexpectedly passed'
            exit 1
          fi
          cat /tmp/showcase-before.log
          grep -q 'follows visible viewport or readable short-window minimum' /tmp/showcase-before.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-viewport-${{ matrix.browser }}
          path: |
            qa/storefront-ui-kit-showcase-*.png
            qa/showcase-viewport-*.json
          if-no-files-found: warn
          retention-days: 14
