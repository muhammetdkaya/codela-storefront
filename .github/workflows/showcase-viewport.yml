name: Showcase refinement regression (no deployment)
on:
  push:
    branches: [fix/showcase-bottom-align-20261028]
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  pull_request:
    paths: ['theme/**', 'tests/**', '.github/workflows/showcase-viewport.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: showcase-viewport-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and package without publication
        run: |
          find theme -name '*.php' -type f -print0 | xargs -0 -n1 php -l
          php tests/homepage.php
          php tests/front-page-source.php
          php tests/sections-preview.php
          node --check theme/codela-storefront/assets/scripts/gallery-horizontal.js
          node --check tests/showcase-viewport-browser.cjs
          node tests/showcase-caption.cjs
          python3 tests/package.py
      - name: Install one browser engine
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          if [ '${{ matrix.browser }}' = chromium ] && command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps ${{ matrix.browser }}
          fi
      - name: Fetch the public AZ banner for labeled fixture previews
        run: |
          curl --fail --location --retry 1 --max-time 30 'https://azseramik.com/wp-content/uploads/2026/10/AZ-Seramik-Kadin-Girisimci-Slider-v4-1024x466.webp' -o /tmp/showcase-az.webp
          echo 'SHOWCASE_REAL_IMAGE=/tmp/showcase-az.webp' >> "$GITHUB_ENV"
      - name: Background coverage, shorter frame, counter and skeleton acceptance
        env:
          SHOWCASE_INLINE_VISUALS: '1'
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          node tests/showcase-viewport-browser.cjs
          node tests/homepage-browser.cjs
      - name: Prove previous 183 CSS fails the shorter-frame contract
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin 2ab3e6211115d6210fc632de504af90425bc9258 --depth=1
          git show 2ab3e6211115d6210fc632de504af90425bc9258:theme/codela-storefront/assets/styles/sections.css > /tmp/showcase-before.css
          SHOWCASE_CSS=/tmp/showcase-before.css SHOWCASE_PHASE=before-183 SHOWCASE_SCREENSHOTS_ONLY=1 node tests/showcase-viewport-browser.cjs
          if SHOWCASE_CSS=/tmp/showcase-before.css node tests/showcase-viewport-browser.cjs > /tmp/showcase-before.log 2>&1; then
            cat /tmp/showcase-before.log
            echo '::error::Previous 183 CSS unexpectedly passed'
            exit 1
          fi
          cat /tmp/showcase-before.log
          grep -q 'reduces the 0.1.183 frame height by 25%' /tmp/showcase-before.log
      - name: Prove previous skeleton CSS fails visible-caption contrast
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin 9a70c2e81a85c756b77dea2dced29b601b2f058d --depth=1
          git show 9a70c2e81a85c756b77dea2dced29b601b2f058d:theme/codela-storefront/assets/styles/navigation-feedback.css > /tmp/showcase-feedback-before.css
          if SHOWCASE_FEEDBACK_CSS=/tmp/showcase-feedback-before.css SHOWCASE_CONTRAST_ONLY=1 SHOWCASE_PHASE=before-contrast node tests/showcase-viewport-browser.cjs > /tmp/showcase-contrast-before.log 2>&1; then
            cat /tmp/showcase-contrast-before.log
            echo '::error::Previous invisible skeleton caption unexpectedly passed'
            exit 1
          fi
          cat /tmp/showcase-contrast-before.log
          grep -q 'placeholder contrasts with the image skeleton fill' /tmp/showcase-contrast-before.log
      - name: Prove previous 184 CSS fails the compact bottom-gap contract
        env:
          TEST_WEBKIT: ${{ matrix.browser == 'webkit' && '1' || '' }}
        run: |
          git fetch origin 0908ab278a4e6b6f425cfb90c9f2862fd673a85a --depth=1
          git show 0908ab278a4e6b6f425cfb90c9f2862fd673a85a:theme/codela-storefront/assets/styles/sections.css > /tmp/showcase-184-before.css
          SHOWCASE_CSS=/tmp/showcase-184-before.css SHOWCASE_PHASE=before-184 SHOWCASE_SCREENSHOTS_ONLY=1 node tests/showcase-viewport-browser.cjs
          if SHOWCASE_CSS=/tmp/showcase-184-before.css SHOWCASE_ALIGNMENT_ONLY=1 node tests/showcase-viewport-browser.cjs > /tmp/showcase-alignment-before.log 2>&1; then
            cat /tmp/showcase-alignment-before.log
            echo '::error::Previous reserved gap unexpectedly passed'
            exit 1
          fi
          cat /tmp/showcase-alignment-before.log
          grep -q 'CTA bottom uses only actual dock overlap' /tmp/showcase-alignment-before.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: showcase-viewport-${{ matrix.browser }}
          path: |
            qa/storefront-ui-kit-showcase-*.png
            qa/showcase-viewport-*.json
          if-no-files-found: warn
          retention-days: 14
