# Same real-WP/Woo acceptance as the Codela repository.
# This alternate runner hosts the 114 matrix because Codela Actions jobs
# ended without an assigned runner; it does not touch production runtime.
name: Storefront 0.1.114 real Woo acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/real-woo-114.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - wordpress: '7.1.3'
            woocommerce: '11.2.1'
          - wordpress: '6.5.5'
            woocommerce: '9.0.2'
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-root-local
          MARIADB_DATABASE: storefront_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    env:
      SF_WP_DIR: /tmp/storefront-ci
      SF_REPORT_DIR: ${{ github.workspace }}/codela/qa/storefront-integration
      SF_THEME_VERSION: 0.1.114
      SF_THEME_SOURCE: 26c78af34a911076879c6c8831d26fb62e5653e9
      SF_WORDPRESS_VERSION: ${{ matrix.wordpress }}
      SF_WOOCOMMERCE_VERSION: ${{ matrix.woocommerce }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: muhammetdkaya/codela
          ref: 25b2b206f088f86674739969e4f7eaeefac1ee66
          path: codela
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, imagick, mbstring, zip
          tools: wp-cli
          coverage: none
      - name: Install disposable WordPress and actual Codela source
        working-directory: codela
        run: |
          if ! command -v wp > /dev/null; then
            curl --fail --location --retry 3 --retry-all-errors https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar -o /tmp/wp
            chmod +x /tmp/wp
            sudo mv /tmp/wp /usr/local/bin/wp
          fi
          wp --info
          mkdir -p "$SF_WP_DIR" "$SF_REPORT_DIR"
          wp core download --path="$SF_WP_DIR" --version="$SF_WORDPRESS_VERSION"
          wp config create --path="$SF_WP_DIR" --dbname=storefront_ci --dbuser=root --dbpass=ci-root-local --dbhost=127.0.0.1:3306
          wp config set WP_HOME http://127.0.0.1:8888 --path="$SF_WP_DIR"
          wp config set WP_SITEURL http://127.0.0.1:8888 --path="$SF_WP_DIR"
          wp config set DISABLE_WP_CRON true --raw --path="$SF_WP_DIR"
          wp core install --path="$SF_WP_DIR" --url=http://127.0.0.1:8888 --title='Disposable Storefront CI' --admin_user=ci-admin --admin_password=ci-admin-local --admin_email=admin@example.test --skip-email
          wp plugin install woocommerce --version="$SF_WOOCOMMERCE_VERSION" --activate --path="$SF_WP_DIR"
          cp -R codela-commerce-toolkit "$SF_WP_DIR/wp-content/plugins/"
          wp plugin activate codela-commerce-toolkit --path="$SF_WP_DIR"
          # Pin the live binary to the immutable source SHA and published manifest.
          # Never accept a stale 0.1.113 binary as 0.1.114 acceptance.
          curl --fail --location --retry 30 --retry-all-errors --retry-delay 10 \
            "https://codela.dev/wp-content/themes/codela-storefront/support/packages/manifest.json" -o /tmp/storefront-manifest.json
          SF_THEME_SHA256="$(python3 - <<'PY'
          import json,os,re
          manifest=json.load(open('/tmp/storefront-manifest.json'))
          assert manifest['theme']=='codela-storefront'
          assert manifest['version']==os.environ['SF_THEME_VERSION'], 'Release version mismatch'
          assert manifest['source_sha']==os.environ['SF_THEME_SOURCE'], 'Release source mismatch'
          assert re.fullmatch(r'[0-9a-f]{64}',manifest['sha256']), 'Invalid release hash'
          assert manifest['package']==f"https://codela.dev/wp-content/themes/codela-storefront/support/packages/codela-storefront-{os.environ['SF_THEME_VERSION']}.zip"
          print(manifest['sha256'])
          PY
          )"
          export SF_THEME_SHA256
          curl --fail --location --retry 30 --retry-all-errors --retry-delay 10 "https://codela.dev/wp-content/themes/codela-storefront/support/packages/codela-storefront-${SF_THEME_VERSION}.zip" -o /tmp/storefront-tested.zip
          echo "$SF_THEME_SHA256  /tmp/storefront-tested.zip" | sha256sum --check
          wp theme install /tmp/storefront-tested.zip --activate --path="$SF_WP_DIR"
          wp rewrite structure '/%postname%/' --path="$SF_WP_DIR"
          mkdir -p "$SF_WP_DIR/wp-content/mu-plugins"
          cp tools/storefront-integration/isolated-only.php "$SF_WP_DIR/wp-content/mu-plugins/storefront-ci.php"
          wp eval-file tools/storefront-integration/setup.php --path="$SF_WP_DIR"
          printf '{"theme_source":"%s","theme_package_sha256":"%s","plugin_source":"%s"}\n' "$SF_THEME_SOURCE" "$SF_THEME_SHA256" "25b2b206f088f86674739969e4f7eaeefac1ee66" > "$SF_REPORT_DIR/sources.json"
      - name: Start local server
        env:
          PHP_CLI_SERVER_WORKERS: 4
        working-directory: codela
        run: |
          php -S 127.0.0.1:8888 -t "$SF_WP_DIR" tools/storefront-integration/router.php > "$SF_REPORT_DIR/server.log" 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8888/ > /dev/null; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Real Chromium and WebKit acceptance
        working-directory: codela
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
          node tools/storefront-integration/navigation-diagnosis.cjs
          node tools/storefront-integration/product-sheet.cjs
          SF_ENGINE=webkit node tools/storefront-integration/product-sheet.cjs
          node tools/storefront-integration/browser.cjs
          SF_ENGINE=webkit node tools/storefront-integration/browser.cjs
          wp eval-file tools/storefront-integration/product-modules-setup.php --path="$SF_WP_DIR"
          node tools/storefront-integration/product-modules.cjs
          SF_ENGINE=webkit node tools/storefront-integration/product-modules.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-storefront-acceptance-${{ matrix.wordpress }}-${{ matrix.woocommerce }}
          path: codela/qa/storefront-integration/
          retention-days: 30
