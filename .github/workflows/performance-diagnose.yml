name: Storefront targeted performance diagnosis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/performance-diagnose.cjs', '.github/workflows/performance-diagnose.yml']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/performance-diagnose.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-performance-diagnosis
          path: qa/performance/
          retention-days: 30
