name: Storefront live gallery acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/gallery-live-check.cjs', '.github/workflows/gallery-live-check.yml']
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/gallery-live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-gallery-acceptance
          path: qa/performance/
          retention-days: 30
