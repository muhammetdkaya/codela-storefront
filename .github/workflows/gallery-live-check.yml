name: Storefront live gallery acceptance
on:
  push:
    branches: [main]
    paths: ['tools/live-product.cjs', 'tools/gallery-live-check.cjs', '.github/workflows/gallery-live-check.yml']
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Codela Storefront']
    branches: [main]
    types: [completed]
permissions:
  contents: read
jobs:
  gallery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/gallery-live-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-gallery-acceptance
          path: qa/performance/
          retention-days: 30
