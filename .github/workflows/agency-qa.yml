name: Agency reference visual QA (no deployment)
on:
  pull_request:
    paths:
      - 'theme/codela-storefront/patterns/agency-*.php'
      - 'theme/codela-storefront/inc/agency.php'
      - 'theme/codela-storefront/inc/section-agency.php'
      - 'theme/codela-storefront/inc/sections.php'
      - 'theme/codela-storefront/config/sections.json'
      - 'theme/codela-storefront/inc/render.php'
      - 'scripts/check-agency-live.py'
      - 'theme/codela-storefront/assets/styles/agency.css'
      - 'theme/codela-storefront/assets/scripts/agency.js'
      - 'theme/codela-storefront/assets/scripts/agency-widgets.js'
      - 'tests/agency*.php'
      - 'tests/agency-media-manifest.py'
      - 'theme/codela-storefront/config/agency-media.json'
      - 'theme/codela-storefront/inc/agency-media.php'
      - 'theme/codela-storefront/assets/media/**'
      - 'tests/agency*-browser.cjs'
      - '.github/workflows/agency-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agency-reference-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  agency:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Install test-only dependencies
        run: |
          npm ci --ignore-scripts
          # The Ubuntu GitHub image already has Chrome; avoid re-downloading
          # Chromium for an Agency-only visual check when it is available.
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - name: Validate agency source and native block pattern
        run: |
          php -l theme/codela-storefront/patterns/agency-home.php
          php -l theme/codela-storefront/inc/section-agency.php
          php -l theme/codela-storefront/inc/section-agency-studio.php
          php -l theme/codela-storefront/inc/section-agency-bento.php
          php -l theme/codela-storefront/inc/section-agency-detail.php
          php -l theme/codela-storefront/inc/section-agency-contact-bento.php
          php -l theme/codela-storefront/inc/section-agency-project.php
          php -l theme/codela-storefront/inc/agency.php
          php -l theme/codela-storefront/inc/sections.php
          python3 tests/agency-media-manifest.py
          php -l theme/codela-storefront/inc/agency-media.php
          php tests/agency.php
          php tests/agency-pages.php
          python3 -m py_compile scripts/check-agency-live.py
          find theme/codela-storefront/patterns/agency-*.php -type f -print0 | xargs -0 -n1 php -l
          node --check theme/codela-storefront/assets/scripts/agency.js
          node --check theme/codela-storefront/assets/scripts/agency-widgets.js
      - name: Test four viewports and real agency interactions
        run: |
          node tests/agency-stage-viewport-browser.cjs
          node tests/agency-navigation-profile-browser.cjs
          node tests/agency-browser.cjs
          node tests/agency-pages-browser.cjs
          node tests/agency-widgets-browser.cjs
          node tests/agency-studio-browser.cjs
          node tests/agency-bento-browser.cjs
          node tests/agency-detail-browser.cjs
          node tests/agency-skeleton-browser.cjs
          node tests/agency-contact-browser.cjs
          node tests/agency-project-browser.cjs
      - name: Preserve phone/desktop reference screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agency-reference-screenshots
          path: qa/agency-*.png
          if-no-files-found: warn
          retention-days: 14
