name: Storefront live document continuity
on:
  push:
    branches: [main]
    paths: ['tools/document-continuity-live.cjs', '.github/workflows/document-continuity-live.yml']
  workflow_run:
    workflows: ['Deploy Codela Storefront']
    branches: [main]
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-document:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save --package-lock=false playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node tools/document-continuity-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: document-continuity-live
          path: qa/continuity/
          retention-days: 30
