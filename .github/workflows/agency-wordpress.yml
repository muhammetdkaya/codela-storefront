name: Agency real WordPress acceptance
on:
  pull_request:
    paths:
      - 'theme/codela-storefront/inc/agency*.php'
      - 'theme/codela-storefront/inc/section-agency*.php'
      - 'theme/codela-storefront/assets/styles/agency*.css'
      - 'theme/codela-storefront/assets/scripts/agency*.js'
      - 'tests/agency-quote-wordpress.php'
      - 'tests/agency-quote-wordpress-browser.cjs'
      - '.github/workflows/agency-wordpress.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: agency-real-wp-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wordpress:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: ci-local
          MARIADB_DATABASE: agency_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: muhammetdkaya/codela
          ref: 02477453bb6a8735cd6ade420a6c19f834616ae8
          path: codela-source
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mysqli, gd, mbstring, zip
          tools: wp-cli
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install browser and verified WP-CLI
        run: |
          npm ci --ignore-scripts
          if command -v google-chrome >/dev/null; then
            echo "CHROMIUM_BIN=$(command -v google-chrome)" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
          if ! command -v wp >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/wp-cli"
            curl --fail --location --retry 4 https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar --output "$RUNNER_TEMP/wp-cli/wp"
            chmod +x "$RUNNER_TEMP/wp-cli/wp"
            echo "$RUNNER_TEMP/wp-cli" >> "$GITHUB_PATH"
          fi
      - name: Run real native WordPress integration
        run: |
          set -eu
          mkdir -p /tmp/agency-real-wp qa
          wp core download --path=/tmp/agency-real-wp
          wp config create --path=/tmp/agency-real-wp --dbname=agency_ci --dbuser=root --dbpass=ci-local --dbhost=127.0.0.1:3306
          wp config set DISABLE_WP_CRON true --raw --path=/tmp/agency-real-wp
          wp config set WP_DEBUG true --raw --path=/tmp/agency-real-wp
          wp config set WP_DEBUG_DISPLAY false --raw --path=/tmp/agency-real-wp
          wp config set WP_DEBUG_LOG true --raw --path=/tmp/agency-real-wp
          wp core install --path=/tmp/agency-real-wp --url=http://127.0.0.1:8897 --title='Agency real acceptance' --admin_user=ci-admin --admin_password=ci-admin-local --admin_email=admin@example.test --skip-email
          cp -R codela-source/codela-commerce-toolkit /tmp/agency-real-wp/wp-content/plugins/
          cp -R theme/codela-storefront /tmp/agency-real-wp/wp-content/themes/
          wp plugin activate codela-commerce-toolkit --path=/tmp/agency-real-wp
          wp option update codela_theme_settings '{"site_experience":"agency","mobile_dock_enabled":false}' --format=json --path=/tmp/agency-real-wp
          wp theme activate codela-storefront --path=/tmp/agency-real-wp
          wp eval-file tests/agency-quote-wordpress.php --path=/tmp/agency-real-wp
          php -S 127.0.0.1:8897 -t /tmp/agency-real-wp > /tmp/agency-real-server.log 2>&1 &
          curl --retry 8 --retry-connrefused --retry-delay 1 -fsS http://127.0.0.1:8897/ -o /tmp/agency-real-home.html
          node tests/agency-quote-wordpress-browser.cjs
      - name: Inspect PHP runtime errors
        if: always()
        run: |
          cat /tmp/agency-real-server.log 2>/dev/null || true
          if [ -f /tmp/agency-real-wp/wp-content/debug.log ]; then
            cat /tmp/agency-real-wp/wp-content/debug.log
            ! grep -Ei 'PHP (Fatal error|Parse error)|Uncaught (Error|Exception)' /tmp/agency-real-wp/wp-content/debug.log
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agency-real-wordpress-screenshots
          path: qa/agency-real-*.png
          if-no-files-found: warn
          retention-days: 14
