name: Production secret history audit
on:
  workflow_dispatch:
  schedule:
    - cron: '47 3 * * 1'
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: python3 scripts/production-secret-scan.py --self-test
      - run: python3 scripts/production-secret-scan.py --history
