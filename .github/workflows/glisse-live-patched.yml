name: Glisse WebKit production DOM hydration smoke (no deployment)
on:
  pull_request:
    paths:
      - 'scripts/glisse-bridge.jsx'
      - 'tests/glisse-live-patched-browser.cjs'
      - '.github/workflows/glisse-live-patched.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --package-lock=false glisse@0.5.0 playwright@1.62.1
      - run: node scripts/build-glisse.mjs
      - run: npx playwright install --with-deps chromium webkit
      - name: Test branch Glisse bundle on actual codela.dev
        run: node tests/glisse-live-patched-browser.cjs
