name: Quick login security checks (no deployment)
on:
  pull_request:
    paths:
      - 'theme/codela-storefront/inc/quick-login.php'
      - 'theme/codela-storefront/assets/scripts/quick-login.js'
      - 'theme/codela-storefront/assets/styles/quick-login.css'
      - 'theme/codela-storefront/languages/tr_TR.l10n.php'
      - 'tests/quick-login.php'
      - 'tests/quick-login-markup.php'
      - 'tests/account-registration-discovery.php'
      - 'theme/codela-storefront/inc/account.php'
      - 'theme/codela-storefront/assets/scripts/auth.js'
      - 'theme/codela-storefront/assets/styles/account.css'
      - 'theme/codela-storefront/assets/styles/account-overlay.css'
      - 'tests/account-browser.cjs'
      - 'tests/account-instant-browser.cjs'
      - 'tests/quick-login-ui.cjs'
      - 'tests/account-keyboard-style-browser.cjs'
      - 'tests/account-focus-browser.cjs'
      - '.github/workflows/quick-login.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax and native WordPress security contracts
        run: |
          php -l theme/codela-storefront/inc/quick-login.php
          php -l theme/codela-storefront/languages/tr_TR.l10n.php
          php tests/quick-login.php
          php tests/quick-login-markup.php
          php tests/account-registration-discovery.php
      - name: WebCrypto integration and browser contract
        run: |
          node --check theme/codela-storefront/assets/scripts/quick-login.js
          node tests/quick-login-ui.cjs
          node --check tests/quick-login-browser.cjs
  browser:
    name: Inline native PIN card (Chromium / WebKit)
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install browser engines
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium webkit
      - name: Signed-in and failed PIN motion acceptance
        run: |
          node tests/account-focus-browser.cjs
          TEST_WEBKIT=1 node tests/account-focus-browser.cjs
          node tests/account-browser.cjs
          node tests/quick-login-browser.cjs
          TEST_WEBKIT=1 node tests/quick-login-browser.cjs
          node tests/account-keyboard-style-browser.cjs
          TEST_WEBKIT=1 node tests/account-keyboard-style-browser.cjs
          node tests/account-instant-browser.cjs
          TEST_WEBKIT=1 node tests/account-instant-browser.cjs
